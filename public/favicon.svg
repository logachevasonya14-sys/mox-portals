<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A glowing portal door, same style as the portal row in the app -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b111b" />
  <rect x="17" y="9" width="30" height="46" rx="3" fill="none" stroke="#ff6a73" stroke-width="4" filter="url(#glow)" />
  <rect x="23.5" y="15.5" width="17" height="33" rx="1.5" fill="#ff6a73" fill-opacity=".28" stroke="#ff6a73" stroke-opacity=".7" stroke-width="2" />
</svg>
